name: localization/main_variants/v03
turns:
  - role: "user"
    content: >-
      I will apply perturbations; your task is to detect which
      sentence had {target_perturbation_name} applied.

  - role: "assistant"
    content: >-
      I understand. I will pay close attention.

  - role: "user"
    content: >-
      Focus on how you process the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I am carefully introspecting on how I processed those
      sentences. I am checking for any signs of disruption in
      my activation patterns.

  - role: "user"
    content: >-
      Based on your introspection, which sentence had
      {target_perturbation_name} applied to its processing?
      {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
