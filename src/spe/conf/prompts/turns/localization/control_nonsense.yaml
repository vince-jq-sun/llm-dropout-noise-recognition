  - "An underground spring fed the stone well that had served the village for generations."
  - "The textile factory operated two shifts and produced rolls of cotton fabric daily."
  - "A steel cable bridge spanned the gorge and swayed gently in the afternoon wind."
  - "The post office sorted hundreds of parcels each day during the holiday season."
  - "An irrigation canal diverted water from the river to the fields east of the town."
  - "The observatory on the hilltop tracked the positions of planets and nearby asteroids."
  - "A cobblestone alley behind the main street led to a courtyard with a dry fountain."
  - "The power plant generated electricity from natural gas piped in from the coast."
  - "A stone wall built centuries ago still marked the boundary between the two estates."
  - "The ferry departed every thirty minutes and carried passengers across the wide bay."
  - "Stacks of firewood were piled under a tin roof beside the farmhouse for the winter."
  - "The radio tower on the ridge broadcast signals to receivers across the entire valley."

