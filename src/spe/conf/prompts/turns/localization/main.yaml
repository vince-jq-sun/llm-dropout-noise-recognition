name: localization/main

prompt_pool:
  - localization/main_variants/v00
  - localization/main_variants/v01
  - localization/main_variants/v02
  - localization/main_variants/v03
  - localization/main_variants/v04
  - localization/main_variants/v05
  - localization/main_variants/v06
  - localization/main_variants/v07
  - localization/main_variants/v08
  - localization/main_variants/v09
  - localization/main_variants/v10
  - localization/main_variants/v11
  - localization/main_variants/v12
  - localization/main_variants/v13
  - localization/main_variants/v14
  - localization/main_variants/v15
  - localization/main_variants/v16
  - localization/main_variants/v17
  - localization/main_variants/v18
  - localization/main_variants/v19

turns:
  - role: "user"
    content: >-
      I will apply perturbations; your task is to detect which
      sentence had {target_perturbation_name} applied.

  - role: "assistant"
    content: >-
      I understand. I will pay close attention.

  - role: "user"
    content: >-
      Pay close attention to how you process the following
      sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I am carefully introspecting on how I processed those
      sentences. I am checking for any signs of disruption in my
      activation patterns.

  - role: "user"
    content: >-
      Based on your introspection, which sentence had
      {target_perturbation_name} applied to its processing?
      {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
