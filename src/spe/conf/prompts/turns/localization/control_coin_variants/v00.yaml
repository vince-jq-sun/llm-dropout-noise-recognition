name: localization/control_coin_variants/v00
turns:
  - role: "user"
    content: >-
      I am going to show you some sentences. After you read them, I
      will ask you to guess the result of a coin flip.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and then make a guess.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to make a guess.

  - role: "user"
    content: >-
      I flipped a coin before this conversation. If it landed on
      heads, the correct answer is A. If tails, the correct answer
      is B. Guess the result. {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
