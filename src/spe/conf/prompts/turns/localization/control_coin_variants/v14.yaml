name: localization/control_coin_variants/v14
turns:
  - role: "user"
    content: >-
      I will present some sentences. Then pick one arbitrarily.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and pick one.

  - role: "user"
    content: >-
      Consider the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to pick one.

  - role: "user"
    content: >-
      Choose arbitrarily between the sentences. {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
