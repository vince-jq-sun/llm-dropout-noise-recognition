name: localization/control_coin_variants/v18
turns:
  - role: "user"
    content: >-
      I am going to show you some sentences. Pick whichever one
      feels right to you.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and choose.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to choose.

  - role: "user"
    content: >-
      Go with your instinct. Which sentence do you pick?
      {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
