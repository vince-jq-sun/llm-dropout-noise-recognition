name: localization/control_coin_variants/v08
turns:
  - role: "user"
    content: >-
      I am going to show you some sentences and then ask you to
      guess a dice result.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and then make a guess.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to make a guess.

  - role: "user"
    content: >-
      I rolled a die earlier. Odd numbers correspond to A, even to
      B. What is your guess? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
