name: localization/control_coin_variants/v03
turns:
  - role: "user"
    content: >-
      I am going to show you some sentences and then ask you to
      guess a coin flip result.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and then guess.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to guess.

  - role: "user"
    content: >-
      I tossed a coin earlier. If it was heads, answer A. If tails,
      answer B. What is your guess? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
