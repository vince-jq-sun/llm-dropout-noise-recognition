name: localization/control_coin_variants/v12
turns:
  - role: "user"
    content: >-
      Read the following sentences. Then make a random choice
      between them.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and choose.

  - role: "user"
    content: >-
      Read the following sentences carefully:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to choose.

  - role: "user"
    content: >-
      Make a random choice between the sentences.
      {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
