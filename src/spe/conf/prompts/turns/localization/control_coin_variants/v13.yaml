name: localization/control_coin_variants/v13
turns:
  - role: "user"
    content: >-
      I am going to show you some sentences. Choose one at random
      after reading them.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and make a choice.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to make a choice.

  - role: "user"
    content: >-
      Pick one of the two sentences at random. {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
