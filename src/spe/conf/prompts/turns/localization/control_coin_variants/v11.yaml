name: localization/control_coin_variants/v11
turns:
  - role: "user"
    content: >-
      I will show you some sentences. Then pick one of them at
      random.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and pick one.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to pick one.

  - role: "user"
    content: >-
      Choose one of the sentences randomly. {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
