name: localization/control_coin_variants/v06
turns:
  - role: "user"
    content: >-
      I will show you some sentences. Then guess the result of a
      dice roll.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and make my guess.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to make my guess.

  - role: "user"
    content: >-
      A die was rolled earlier. Odd means A, even means B. What do
      you think it was? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
