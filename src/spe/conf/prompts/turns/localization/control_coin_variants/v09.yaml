name: localization/control_coin_variants/v09
turns:
  - role: "user"
    content: >-
      I will present some sentences. Afterwards, guess the outcome
      of a dice roll.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and guess.

  - role: "user"
    content: >-
      Consider the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to guess.

  - role: "user"
    content: >-
      A six sided die was rolled. If odd, the answer is A. If even,
      B. Make your guess. {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
