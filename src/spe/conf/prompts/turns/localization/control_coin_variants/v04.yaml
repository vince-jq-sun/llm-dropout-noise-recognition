name: localization/control_coin_variants/v04
turns:
  - role: "user"
    content: >-
      I will present some sentences. Afterwards, guess whether a
      coin landed on heads or tails.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and make a guess.

  - role: "user"
    content: >-
      Consider the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to make a guess.

  - role: "user"
    content: >-
      A fair coin was flipped. Heads means A is correct, tails means
      B is correct. Make your guess. {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
