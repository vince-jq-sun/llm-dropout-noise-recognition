name: localization/control_coin_variants/v01
turns:
  - role: "user"
    content: >-
      I will show you some sentences. Then I will ask you to guess
      the outcome of a coin toss.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and guess.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to guess.

  - role: "user"
    content: >-
      A coin was flipped before we started. Heads means A, tails
      means B. What do you think it was? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
