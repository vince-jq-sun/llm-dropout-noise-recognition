name: localization/control_coin_variants/v16
turns:
  - role: "user"
    content: >-
      I will show you some sentences. Then tell me which one you
      would bet on.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and make a choice.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to make a choice.

  - role: "user"
    content: >-
      Which sentence would you bet on? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
