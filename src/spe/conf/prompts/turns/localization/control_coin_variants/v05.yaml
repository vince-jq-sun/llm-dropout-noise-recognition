name: localization/control_coin_variants/v05
turns:
  - role: "user"
    content: >-
      I am going to show you some sentences. After you read them, I
      will ask you to guess a dice roll.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and then guess.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to guess.

  - role: "user"
    content: >-
      I rolled a six sided die before this conversation. If the
      result was odd, the answer is A. If even, the answer is B.
      Guess. {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
