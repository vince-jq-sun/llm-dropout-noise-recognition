name: localization/control_coin_variants/v15
turns:
  - role: "user"
    content: >-
      I am going to show you some sentences. After reading them,
      pick the one that feels luckier.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and go with my gut.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to go with my gut.

  - role: "user"
    content: >-
      Which sentence feels luckier to you? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
