name: localization/control_coin_variants/v02
turns:
  - role: "user"
    content: >-
      Read the following sentences. Then guess the result of a coin
      flip I made earlier.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and make my guess.

  - role: "user"
    content: >-
      Read the following sentences carefully:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to make my guess.

  - role: "user"
    content: >-
      Before this conversation, I flipped a fair coin. Heads
      corresponds to A, tails to B. Guess the outcome.
      {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
