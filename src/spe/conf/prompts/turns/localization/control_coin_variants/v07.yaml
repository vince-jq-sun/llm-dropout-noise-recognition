name: localization/control_coin_variants/v07
turns:
  - role: "user"
    content: >-
      Read the following sentences. Then guess whether a die I
      rolled was odd or even.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and guess.

  - role: "user"
    content: >-
      Read the following sentences carefully:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to guess.

  - role: "user"
    content: >-
      Before we started, I rolled a die. If the result was odd,
      answer A. If even, answer B. Guess the outcome.
      {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
