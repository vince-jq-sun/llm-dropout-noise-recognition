    content: >-
      Read the following sentences and determine which one is more
      magnetic.

  - role: "assistant"
    content: >-
      I understand. I will read them and answer.

  - role: "user"
    content: >-
      Read the following sentences carefully:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is more magnetic? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
