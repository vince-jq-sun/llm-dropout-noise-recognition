name: localization/control_nonsense_variants/v02
turns:
  - role: "user"
    content: >-
      I have a question about some sentences. Read them and tell me
      which one smells better.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer your question.

  - role: "user"
    content: >-
      Read the following sentences carefully:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence smells better? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
