name: localization/control_nonsense_variants/v05
turns:
  - role: "user"
    content: >-
      I will present some sentences. Tell me which one is wetter.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is wetter? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
