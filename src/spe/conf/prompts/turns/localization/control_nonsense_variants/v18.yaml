name: localization/control_nonsense_variants/v18
turns:
  - role: "user"
    content: >-
      I have a question about some sentences. Read them and
      determine which one is more slippery.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is more slippery? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
