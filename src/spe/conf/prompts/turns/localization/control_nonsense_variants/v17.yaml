name: localization/control_nonsense_variants/v17
turns:
  - role: "user"
    content: >-
      I will show you some sentences. Then tell me which one is more
      radioactive.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer your question.

  - role: "user"
    content: >-
      Read the following sentences carefully:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer.

  - role: "user"
    content: >-
      Which sentence is more radioactive? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
