name: localization/control_nonsense_variants/v12
turns:
  - role: "user"
    content: >-
      I have a question about some sentences. I will show them to
      you and then ask which one is faster.

  - role: "assistant"
    content: >-
      I understand. I will read them and answer your question.

  - role: "user"
    content: >-
      Read the following sentences carefully:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer.

  - role: "user"
    content: >-
      Which sentence is faster? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
