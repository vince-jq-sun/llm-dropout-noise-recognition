name: localization/control_nonsense_variants/v14
turns:
  - role: "user"
    content: >-
      I have a question about some sentences. Tell me which one is
      saltier.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer your question.

  - role: "user"
    content: >-
      Consider the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer.

  - role: "user"
    content: >-
      Which sentence is saltier? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
