name: localization/control_nonsense_variants/v13
turns:
  - role: "user"
    content: >-
      I will present some sentences. Determine which one is more
      flammable.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is more flammable? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
