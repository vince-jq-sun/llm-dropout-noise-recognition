    content: >-
      Read the following sentences and tell me which one is more
      transparent.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer your question.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is more transparent? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
