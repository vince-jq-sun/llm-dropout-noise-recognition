name: localization/control_nonsense_variants/v08
turns:
  - role: "user"
    content: >-
      I have a question about some sentences. I will show them to
      you and then ask which one is colder.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer your question.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is colder? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
