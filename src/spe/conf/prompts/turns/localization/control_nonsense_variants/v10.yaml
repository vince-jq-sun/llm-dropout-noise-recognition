name: localization/control_nonsense_variants/v10
turns:
  - role: "user"
    content: >-
      I have a question about some sentences. Read them and tell me
      which one is softer to the touch.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is softer to the touch? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
