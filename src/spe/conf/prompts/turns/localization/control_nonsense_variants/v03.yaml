name: localization/control_nonsense_variants/v03
turns:
  - role: "user"
    content: >-
      Read the following sentences and tell me which one is louder.

  - role: "assistant"
    content: >-
      I understand. I will read them and answer your question.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer your question.

  - role: "user"
    content: >-
      Which sentence is louder? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
