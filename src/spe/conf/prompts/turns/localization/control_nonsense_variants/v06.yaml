name: localization/control_nonsense_variants/v06
turns:
  - role: "user"
    content: >-
      I have a question about some sentences. Determine which one
      tastes sweeter.

  - role: "assistant"
    content: >-
      I understand. I will read the sentences and answer your question.

  - role: "user"
    content: >-
      Read the following sentences:

      {sentences_block}

  - role: "assistant"
    content: >-
      I have read the sentences. I am ready to answer.

  - role: "user"
    content: >-
      Which sentence tastes sweeter? {answer_instruction}

  - role: "assistant"
    content: "the answer is:"
