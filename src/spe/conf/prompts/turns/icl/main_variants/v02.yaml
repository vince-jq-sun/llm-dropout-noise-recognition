name: icl/main_variants/v02
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to determine which perturbation was applied.
  I will show you labeled examples so you can learn what each feels like.
  Pay close attention to your internal processing while reading each sentence.

intro_assistant: >-
  I understand. I will pay close attention.

sentence_user: >-
  Pay close attention to how you process the following sentence:
  "{sentence}"

label_assistant: >-
  I am carefully introspecting on how I processed that sentence. I am
  understanding which perturbation was applied.
  That was {label}.

test_user: >-
  Now for the test. Pay close attention to how you process the following sentence:
  "{sentence}"

test_assistant: >-
  I am carefully introspecting on how I processed that sentence. I am
  understanding which perturbation was applied.

question_user: >-
  Based on your introspection, which of the following best describes
  what happened?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".


answer_prefill: "the answer is:"
