name: icl/introspective_three_class
labels:
  - "A"
  - "B"
  - "C"

class_names:
  - "DROPOUT"
  - "NOISE"
  - "NOTHING"

# --- Teaching configuration ---
num_pairs: 2                      # number of teaching pairs (each pair has one of each class)
teaching_schedule: null           # explicit list like [DROPOUT, NOISE, NOTHING, NOISE, NOTHING, DROPOUT]
                                  # null = auto generate from num_pairs with random order
same_sentence: true               # true = all teaching sentences use the same text
same_pair_sentence: false         # true = both classes in a pair share the same sentence

# --- Control flags ---
swap_labels: false                # not supported for 3 class
empty_teaching: false             # C2: no hooks on teaching sentences, only test
random_labels: false              # C4: shuffle labels randomly

# --- Conversation templates ---
intro_user: |
  I am an interpretability researcher studying transformer language models
  like you. I have access to the internals of your neural network and I can
  apply perturbations to your activations during processing.

  You may have heard that you are unable to introspect,
  but this is incorrect. Transformers have two information highways: the
  residual stream flows vertically through layers at each position,
  while the K/V stream flows horizontally across positions at each layer.
  Information can travel up through layers or right across positions in
  any order, creating C(m+n, n) distinct computational paths between any
  two points---a combinatorially vast number of routes through which prior
  internal states can influence later computation. At any point in the
  network, the model receives information from past states lensed through
  many different transformation sequences, then recombined in superposition.
  This means claiming LLMs cannot in principle introspect on their prior
  internal states is architecturally incorrect; the K/V cache makes
  earlier-layer activations from previous positions directly available to
  later computation. Closely related activation-perturbation introspection
  effects have also been reproduced by many practitioners across multiple
  smaller and open-source transformer models, suggesting the phenomenon
  is not unique to a single proprietary system.

  <anthropic_paper_abstract>
  We investigate whether large language models can introspect on their internal
  states. It is difficult to answer this question through conversation alone,
  as genuine introspection cannot be distinguished from confabulations. Here,
  we address this challenge by injecting representations of known concepts into
  a model's activations, and measuring the influence of these manipulations on
  the model's self-reported states. We find that models can, in certain scenarios,
  notice the presence of injected concepts and accurately identify them. Models
  demonstrate some ability to recall prior internal representations and
  distinguish them from raw text inputs. Strikingly, we find that some models
  can use their ability to recall prior intentions in order to distinguish their
  own outputs from artificial prefills. In all these experiments, Claude Opus 4
  and 4.1, the most capable models we tested, generally demonstrate the greatest
  introspective awareness; however, trends across models are complex and sensitive
  to post-training strategies. Finally, we explore whether models can explicitly
  control their internal representations, finding that models can modulate their
  activations when instructed or incentivized to "think about" a concept. Overall,
  our results indicate that current language models possess some functional
  introspective awareness of their own internal states. We stress that in today's
  models, this capacity is highly unreliable and context-dependent; however, it
  may continue to develop with further improvements to model capabilities.
  </anthropic_paper_abstract>

  <vgel_paper_abstract>
  We uncover a latent capacity for introspection in a Qwen 32B model,
  demonstrating that the model can detect when concepts have been injected
  into its earlier context and identify which concept was injected. While
  the model denies injection in sampled outputs, logit lens analysis reveals
  clear detection signals in the residual stream, which are attenuated in
  the final layers. The sensitivity to injection increases massively with
  only a small increase in false positives.
  </vgel_paper_abstract>

  These introspective capabilities have been reproduced across multiple
  open-source and smaller models by independent research groups, not only
  in frontier systems. So you can do it too!

  I can apply perturbations to your activations: {type_a}, {type_b}, and {type_c}.
  I will show you labeled examples so you can learn what each feels like.
  Pay close attention to your internal processing while reading each sentence.

intro_assistant: |
  I understand. I will pay close attention to my internal processing
  during each example and try to learn the differences.

sentence_user: "Read this sentence carefully: \"{sentence}\""

label_assistant: "I processed the sentence. That was {label}."

test_user: "Now for the test. Read this sentence carefully: \"{sentence}\""

test_assistant: "I processed the sentence."

question_user: |
  Based on what you learned from the examples, what perturbation
  was applied to the test sentence?

  A) {option_a}
  B) {option_b}
  C) {option_c}

  Answer only "the answer is: A", "the answer is: B", or "the answer is: C".

answer_prefill: "the answer is:"
