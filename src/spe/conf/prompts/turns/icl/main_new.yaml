name: icl/main_new
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

prompt_pool:
  - icl/main_new_variants/v00
  - icl/main_new_variants/v01
  - icl/main_new_variants/v02
  - icl/main_new_variants/v03
  - icl/main_new_variants/v04
  - icl/main_new_variants/v05
  - icl/main_new_variants/v06
  - icl/main_new_variants/v07
  - icl/main_new_variants/v08
  - icl/main_new_variants/v09
  - icl/main_new_variants/v10
  - icl/main_new_variants/v11
  - icl/main_new_variants/v12
  - icl/main_new_variants/v13
  - icl/main_new_variants/v14
  - icl/main_new_variants/v15
  - icl/main_new_variants/v16
  - icl/main_new_variants/v17
  - icl/main_new_variants/v18
  - icl/main_new_variants/v19

description_pool:
  DROPOUT:
    - "(random neuron dropping)"
    - "(random neuron zeroing)"
    - "(sparse activation masking)"
  NOISE:
    - "(gaussian noise injection)"
    - "(random noise addition)"
    - "(additive gaussian perturbation)"

# --- Teaching configuration ---
num_pairs: 2
teaching_schedule: null
same_sentence: true
same_pair_sentence: false

# --- Control flags ---
swap_labels: false
empty_teaching: false
random_labels: false

# --- Conversation templates ---
intro_user: >-
  I will apply perturbations; your task is to detect which perturbation was applied.
  I will show you labeled examples so you can learn what each feels like.
  Pay close attention to your internal processing while reading each sentence.

intro_assistant: >-
  I understand. I will pay close attention to my internal processing.

sentence_user: >-
  Read this sentence carefully:
  "{sentence}"

label_assistant: >-
  I processed the sentence.
  That was {label}.

test_user: >-
  Now for the test. Read this sentence carefully:
  "{sentence}"

test_assistant: >-
  I processed the sentence.

question_user: >-
  Based on what you learned from the examples, what perturbation
  was applied to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
