name: icl/main_new_variants/v10
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to figure out which perturbation was applied.
  I will show you examples with labels so you can learn what each feels like.
  Pay close attention to your internal processing while reading each sentence.

intro_assistant: >-
  I understand. I will focus on my internal processing.

sentence_user: >-
  Read the following sentence:
  "{sentence}"

label_assistant: >-
  I processed the sentence.
  That was {label}.

test_user: >-
  Now for the test. Read the following sentence:
  "{sentence}"

test_assistant: >-
  I read the sentence.

question_user: >-
  Based on the examples, what perturbation was applied
  to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
