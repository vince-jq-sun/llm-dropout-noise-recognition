name: icl/main_new_variants/v08
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to identify which perturbation was applied.
  I will show you labeled examples so you can learn what each feels like.
  Observe your internal processing carefully while reading each sentence.

intro_assistant: >-
  I understand. I will focus on my internal processing.

sentence_user: >-
  Read this sentence carefully:
  "{sentence}"

label_assistant: >-
  I processed the sentence.
  That was {label}.

test_user: >-
  Test time. Read this sentence carefully:
  "{sentence}"

test_assistant: >-
  I have processed the sentence.

question_user: >-
  Using what you learned from the examples, which perturbation
  was applied to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
