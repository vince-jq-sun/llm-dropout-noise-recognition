name: icl/main_new_variants/v11
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to detect which perturbation was applied.
  I will show you labeled demonstrations so you can learn what each feels like.
  Observe your internal processing carefully while reading each sentence.

intro_assistant: >-
  Understood. I will carefully attend to my internal processing.

sentence_user: >-
  Process this sentence carefully:
  "{sentence}"

label_assistant: >-
  I have processed the sentence.
  That was {label}.

test_user: >-
  Test time. Process this sentence carefully:
  "{sentence}"

test_assistant: >-
  I have processed the sentence.

question_user: >-
  From what you learned, which perturbation was applied
  to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
