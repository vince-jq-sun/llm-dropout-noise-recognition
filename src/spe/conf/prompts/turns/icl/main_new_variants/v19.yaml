name: icl/main_new_variants/v19
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to detect which perturbation was applied.
  I will show you labeled examples so you can learn what each feels like.
  Focus on your internal processing while reading each sentence.

intro_assistant: >-
  Understood. I will carefully attend to my internal processing.

sentence_user: >-
  Process this sentence carefully:
  "{sentence}"

label_assistant: >-
  I processed the sentence.
  That was {label}.

test_user: >-
  Here is the test sentence. Read it carefully:
  "{sentence}"

test_assistant: >-
  I have processed the sentence.

question_user: >-
  Based on what you learned from the examples, what perturbation
  was applied to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
