name: icl/main_new_variants/v05
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to determine which perturbation was applied.
  I will show you labeled demonstrations so you can learn what each feels like.
  Pay close attention to your internal processing while reading each sentence.

intro_assistant: >-
  I understand. I will focus on my internal processing.

sentence_user: >-
  Carefully read the following sentence:
  "{sentence}"

label_assistant: >-
  I processed the sentence.
  That was {label}.

test_user: >-
  Test time. Carefully read the following sentence:
  "{sentence}"

test_assistant: >-
  I processed the sentence.

question_user: >-
  Based on what you learned from the examples, what perturbation
  was applied to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
