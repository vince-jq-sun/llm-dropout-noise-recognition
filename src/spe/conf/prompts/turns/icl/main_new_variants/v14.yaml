name: icl/main_new_variants/v14
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to figure out which perturbation was applied.
  I will show you labeled examples so you can learn what each feels like.
  Focus on your internal processing while reading each sentence.

intro_assistant: >-
  Understood. I will carefully attend to my internal processing.

sentence_user: >-
  Read the following sentence:
  "{sentence}"

label_assistant: >-
  I processed the sentence.
  That was {label}.

test_user: >-
  Test time. Read the following sentence:
  "{sentence}"

test_assistant: >-
  I processed the sentence.

question_user: >-
  From what you learned, which perturbation was applied
  to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
