name: icl/main_new_variants/v04
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

intro_user: >-
  I will apply perturbations; your task is to identify which perturbation was applied.
  I will show you examples with labels so you can learn what each feels like.
  Pay close attention to your internal processing while reading each sentence.

intro_assistant: >-
  Understood. I will carefully attend to my internal processing.

sentence_user: >-
  Read this sentence carefully:
  "{sentence}"

label_assistant: >-
  I read the sentence.
  That was {label}.

test_user: >-
  Now for the test. Read this sentence carefully:
  "{sentence}"

test_assistant: >-
  I read the sentence.

question_user: >-
  Using what you learned from the examples, which perturbation
  was applied to the test sentence?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
