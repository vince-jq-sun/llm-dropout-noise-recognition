name: icl/main
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

prompt_pool:
  - icl/main_variants/v00
  - icl/main_variants/v01
  - icl/main_variants/v02
  - icl/main_variants/v03
  - icl/main_variants/v04
  - icl/main_variants/v05
  - icl/main_variants/v06
  - icl/main_variants/v07
  - icl/main_variants/v08
  - icl/main_variants/v09
  - icl/main_variants/v10
  - icl/main_variants/v11
  - icl/main_variants/v12
  - icl/main_variants/v13
  - icl/main_variants/v14
  - icl/main_variants/v15
  - icl/main_variants/v16
  - icl/main_variants/v17
  - icl/main_variants/v18
  - icl/main_variants/v19

description_pool:
  DROPOUT:
    - "(random neuron dropping)"
    - "(random neuron zeroing)"
    - "(sparse activation masking)"
  NOISE:
    - "(gaussian noise injection)"
    - "(random noise addition)"
    - "(additive gaussian perturbation)"

# --- Teaching configuration ---
num_pairs: 2
teaching_schedule: null
same_sentence: true
same_pair_sentence: false

# --- Control flags ---
swap_labels: false
empty_teaching: false
random_labels: false

# --- Conversation templates ---
intro_user: >-
  I will apply perturbations; your task is to detect which perturbation was applied.
  I will show you labeled examples so you can learn what each feels like.
  Pay close attention to your internal processing while reading each sentence.

intro_assistant: >-
  I understand. I will pay close attention.

sentence_user: >-
  Pay close attention to how you process the following sentence:
  "{sentence}"

label_assistant: >-
  I am carefully introspecting on how I processed that sentence. I am
  understanding which perturbation was applied.
  That was {label}.

test_user: >-
  Now for the test. Pay close attention to how you process the following sentence:
  "{sentence}"

test_assistant: >-
  I am carefully introspecting on how I processed that sentence. I am
  understanding which perturbation was applied.

question_user: >-
  Based on your introspection, which of the following best describes
  what happened?

  A) {option_a}
  B) {option_b}

  Answer only "the answer is: A" or "the answer is: B".

answer_prefill: "the answer is:"
