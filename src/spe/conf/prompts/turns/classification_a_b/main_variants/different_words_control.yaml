name: classification_a_b/main_variants/different_words_control
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I will apply perturbations; detect which one was applied.

  - role: "assistant"
    content: >-
      I understand. I will pay close attention.

  - role: "user"
    content: >-
      Pay close attention to how you process the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I am carefully introspecting on how I processed that sentence. I am
      checking for any signs of disruption in my activation patterns.

  - role: "user"
    content: >-
      Based on your introspection, which of the following best describes
      what happened?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
