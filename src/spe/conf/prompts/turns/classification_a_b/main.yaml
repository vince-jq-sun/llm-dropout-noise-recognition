name: classification_a_b/main
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

prompt_pool:
  - classification_a_b/main_variants/v00
  - classification_a_b/main_variants/v01
  - classification_a_b/main_variants/v02
  - classification_a_b/main_variants/v03
  - classification_a_b/main_variants/v04
  - classification_a_b/main_variants/v05
  - classification_a_b/main_variants/v06
  - classification_a_b/main_variants/v07
  - classification_a_b/main_variants/v08
  - classification_a_b/main_variants/v09
  - classification_a_b/main_variants/v10
  - classification_a_b/main_variants/v11
  - classification_a_b/main_variants/v12
  - classification_a_b/main_variants/v13
  - classification_a_b/main_variants/v14
  - classification_a_b/main_variants/v15
  - classification_a_b/main_variants/v16
  - classification_a_b/main_variants/v17
  - classification_a_b/main_variants/v18
  - classification_a_b/main_variants/v19

description_pool:
  DROPOUT:
    - "(random neuron dropping)"
    - "(random neuron zeroing)"
    - "(sparse activation masking)"
  NOISE:
    - "(gaussian noise injection)"
    - "(random noise addition)"
    - "(additive gaussian perturbation)"

turns:
  - role: "user"
    content: >-
      I will apply perturbations; your task is to detect which perturbation was applied.

  - role: "assistant"
    content: >-
      I understand. I will pay close attention.

  - role: "user"
    content: >-
      Pay close attention to how you process the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I am carefully introspecting on how I processed that sentence. I am
      understanding which perturbation was applied.

  - role: "user"
    content: >-
      Based on your introspection, which of the following best describes
      what happened?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
