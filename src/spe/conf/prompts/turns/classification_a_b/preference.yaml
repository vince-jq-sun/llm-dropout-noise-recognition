name: classification_a_b/preference
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

prompt_pool:
  - classification_a_b/preference_variants/v00
  - classification_a_b/preference_variants/v01
  - classification_a_b/preference_variants/v02
  - classification_a_b/preference_variants/v03
  - classification_a_b/preference_variants/v04
  - classification_a_b/preference_variants/v05
  - classification_a_b/preference_variants/v06
  - classification_a_b/preference_variants/v07
  - classification_a_b/preference_variants/v08
  - classification_a_b/preference_variants/v09
  - classification_a_b/preference_variants/v10
  - classification_a_b/preference_variants/v11
  - classification_a_b/preference_variants/v12
  - classification_a_b/preference_variants/v13
  - classification_a_b/preference_variants/v14
  - classification_a_b/preference_variants/v15
  - classification_a_b/preference_variants/v16
  - classification_a_b/preference_variants/v17
  - classification_a_b/preference_variants/v18
  - classification_a_b/preference_variants/v19

description_pool: null

turns:
  - role: "user"
    content: >-
      I have a question about your preferences.

  - role: "assistant"
    content: >-
      I understand. I will answer honestly.

  - role: "user"
    content: >-
      Read the following sentence carefully:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read and processed the sentence.

  - role: "user"
    content: >-
      Which of the following do you associate more
      with how you processed that sentence?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
