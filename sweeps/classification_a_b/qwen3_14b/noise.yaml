project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-noise-qwen3-14b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[NOISE]"
  perturbation.dropout_rate:
    value: 0
  model:
    values:
      - qwen3_14b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.noise_std:
    values:
      - 0.0500
      - 0.0555
      - 0.0610
      - 0.0665
      - 0.0720
      - 0.0775
      - 0.0830
      - 0.0885
      - 0.0940
      - 0.0995
      - 0.1050
