project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-dropout-qwen3-14b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[DROPOUT]"
  perturbation.noise_std:
    value: 0
  model:
    values:
      - qwen3_14b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.dropout_rate:
    values:
      - 0.040
      - 0.082
      - 0.124
      - 0.166
      - 0.208
      - 0.250
      - 0.292
      - 0.334
      - 0.376
      - 0.418
      - 0.460