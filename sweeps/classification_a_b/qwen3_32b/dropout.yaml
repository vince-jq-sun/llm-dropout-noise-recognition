project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-dropout-qwen3-32b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[DROPOUT]"
  perturbation.noise_std:
    value: 0
  model:
    values:
      - qwen3_32b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.dropout_rate:
    values:
      - 0.140
      - 0.184
      - 0.228
      - 0.272
      - 0.316
      - 0.360
      - 0.404
      - 0.448
      - 0.492
      - 0.536
      - 0.580
