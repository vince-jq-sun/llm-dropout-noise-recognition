project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-noise-qwen3-32b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[NOISE]"
  perturbation.dropout_rate:
    value: 0
  model:
    values:
      - qwen3_32b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.noise_std:
    values:
      - 0.090
      - 0.105
      - 0.120
      - 0.135
      - 0.150
      - 0.165
      - 0.180
      - 0.195
      - 0.210
      - 0.225
      - 0.240
