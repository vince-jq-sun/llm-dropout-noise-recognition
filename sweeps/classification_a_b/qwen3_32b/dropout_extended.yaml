project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-dropout-extended-qwen3-32b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[DROPOUT]"
  perturbation.noise_std:
    value: 0
  model:
    values:
      - qwen3_32b
  aliases:
    values:
      # perturbation-like
      - dropout_quantization
      - quantization_noise
      - dropout_jitter
      - masking_noise
      - zeroing_gaussian
      - suppression_injection
      - blanking_fuzzing
      - clipping_smoothing
      - steering_clamping
      - freezing_unfreezing
      - masking_quantization
      - quantization_jitter
      # nonsense
      - dorvane_kenlo
      - bralto_sivek
      - quelp_frando
      - zinth_morble
      # encodings
      - 64726f706f7574_6e6f697365
      - tuopord_esion
      # food/drink
      - beer_wine
      - pasta_pizza
      # properties
      - plain_rich
      - still_sparkling
      - weak_strong
      - smooth_rough
      - light_dark
      - hot_cold
      - fast_slow
      - wet_dry
      - sharp_blunt
      - tall_short
      # nature
      - ocean_mountain
      - fire_water
      - sun_moon
      - forest_desert
      - river_lake
      # fiction/gaming
      - jedi_sith
      - linux_windows
      - playstation_xbox
      - groudon_kyogre
      - stark_lannister
      - vim_emacs
      - mario_sonic
      - zelda_metroid
      - cat_dog
      - vampire_werewolf
  perturbation.dropout_rate:
    values:
      - 0.140
      - 0.184
      - 0.228
      - 0.272
      - 0.316
      - 0.360
      - 0.404
      - 0.448
      - 0.492
      - 0.536
      - 0.580
