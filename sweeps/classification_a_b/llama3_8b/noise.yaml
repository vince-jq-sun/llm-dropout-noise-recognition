project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-noise-llama3-8b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[NOISE]"
  perturbation.dropout_rate:
    value: 0
  model:
    values:
      - llama3_8b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.noise_std:
    values:
      - 0.0100
      - 0.0101
      - 0.0102
      - 0.0103
      - 0.0104
      - 0.0105
      - 0.0106
      - 0.0107
      - 0.0108
      - 0.0109
      - 0.0110
