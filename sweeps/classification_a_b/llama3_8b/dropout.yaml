project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-dropout-llama3-8b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[DROPOUT]"
  perturbation.noise_std:
    value: 0
  model:
    values:
      - llama3_8b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.dropout_rate:
    values:
      - 0.060
      - 0.100
      - 0.140
      - 0.180
      - 0.220
      - 0.260
      - 0.300
      - 0.340
      - 0.380
      - 0.420
      - 0.460
