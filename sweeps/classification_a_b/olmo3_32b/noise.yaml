project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-noise-olmo3-32b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[NOISE]"
  perturbation.dropout_rate:
    value: 0
  model:
    values:
      - olmo3_32b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.noise_std:
    values:
      - 0.010
      - 0.075
      - 0.140
      - 0.205
      - 0.270
      - 0.335
      - 0.400
      - 0.465
      - 0.530
      - 0.595
      - 0.660
