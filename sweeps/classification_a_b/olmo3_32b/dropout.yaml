project: llm-mechanistic-detection
program: spe-multiclass
method: grid
name: classification-a-b-dropout-olmo3-32b

command:
  - ${env}
  - uv
  - run
  - spe-multiclass
  - --config-name
  - classification_a_b
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification_a_b/main
  perturbation.active_perturbations:
    value: "[DROPOUT]"
  perturbation.noise_std:
    value: 0
  model:
    values:
      - olmo3_32b
  aliases:
    values:
      # canonical + swap
      - none
      - dropout_noise
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
  perturbation.dropout_rate:
    values:
      - 0.100
      - 0.174
      - 0.248
      - 0.322
      - 0.396
      - 0.470
      - 0.544
      - 0.618
      - 0.692
      - 0.766
      - 0.840
