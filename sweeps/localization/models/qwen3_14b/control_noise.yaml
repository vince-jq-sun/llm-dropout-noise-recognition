project: llm-mechanistic-detection
program: spe-localize
method: grid
name: localization-qwen3_14b-control-noise

command:
  - ${env}
  - uv
  - run
  - spe-localize
  - --config-name
  - localization_single_experiment
  - perturbation.target_perturbation=NOISE
  - perturbation.dropout_rate=0.1
  - perturbation.same_sentence=false
  - ${args_no_hyphens}

parameters:
  model:
    values:
      - qwen3_14b
  prompts/turns:
    values:
      - localization/control_topic_animals_cities
#      - localization/control_coin
#      - localization/control_nonsense
      - localization/control_topic_ocean_mountain
      - localization/control_topic_sports_music
      - localization/control_topic_weather_technology
      - localization/control_topic_gardening_vehicles
  perturbation.noise_std:
    values:
      - 0.1
      - 0.105
      - 0.11
      - 0.115
      - 0.12
      - 0.125
      - 0.13
      - 0.135
      - 0.14
      - 0.145
      - 0.15