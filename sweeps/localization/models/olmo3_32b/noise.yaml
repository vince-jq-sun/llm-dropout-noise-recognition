project: llm-mechanistic-detection
program: spe-localize
method: grid
name: localization-olmo3_32b-noise

command:
  - ${env}
  - uv
  - run
  - spe-localize
  - --config-name
  - localization_single_experiment
  - perturbation.target_perturbation=NOISE
  - perturbation.dropout_rate=0.1
  - ${args_no_hyphens}

parameters:
  model:
    values:
      - olmo3_32b
  experiment.sentences_file:
    values:
      - data/sentences/3tok.txt
      - data/sentences/7tok.txt
      - data/sentences/11tok.txt
      - data/sentences/15tok.txt
      - data/sentences/19tok.txt
      - data/sentences/23tok.txt
  perturbation.noise_std:
    values:
      - 0.5
      - 0.52
      - 0.54
      - 0.56
      - 0.58
      - 0.6
      - 0.62
      - 0.64
      - 0.66
      - 0.68
      - 0.7