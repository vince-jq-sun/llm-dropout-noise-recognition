project: llm-mechanistic-detection
program: spe-localize
method: grid
name: localization-control-dropout

command:
  - ${env}
  - uv
  - run
  - spe-localize
  - --config-name
  - localization_single_experiment
  - perturbation.same_sentence=false
  - ${args_no_hyphens}

parameters:
  model:
    values:
      - qwen3_14b
      - qwen3_32b
      - olmo3_32b
      - llama3_8b
      - gemma3_1b
  prompts/turns:
