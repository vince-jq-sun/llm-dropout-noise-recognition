project: llm-mechanistic-detection
program: spe-icl
method: grid
name: icl-control-qwen3-14b

command:
  - ${env}
  - uv
  - run
  - spe-icl
  - --config-name
  - icl
  - ${args_no_hyphens}

# Control experiments: alias names, swap_labels

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts.turns.num_pairs:
    values:
      - 1
      - 3
      - 5
      - 7
      - 9
  aliases:
    values:
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
      # general
      - weak_strong
  model:
    values:
      - qwen3_14b
  prompts/turns:
    values:
      - icl/main_new
  prompts.turns.same_sentence:
    value: false
  prompts.turns.same_pair_sentence:
    values:
      - true
#      - false
  prompts.turns.swap_labels:
    values:
      - true
      - false
  perturbation.dropout_rate:
    values:
      - 0.040
      - 0.082
      - 0.124
      - 0.166
      - 0.208
      - 0.250
      - 0.292
      - 0.334
      - 0.376
      - 0.418
      - 0.460

  perturbation.noise_std:
    values:
      - 0.0500
      - 0.0555
      - 0.0610
      - 0.0665
      - 0.0720
      - 0.0775
      - 0.0830
      - 0.0885
      - 0.0940
      - 0.0995
      - 0.1050
