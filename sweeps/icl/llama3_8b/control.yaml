project: llm-mechanistic-detection
program: spe-icl
method: grid
name: icl-control-llama3-8b

command:
  - ${env}
  - uv
  - run
  - spe-icl
  - --config-name
  - icl
  - ${args_no_hyphens}

# Control experiments: alias names, swap_labels

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts.turns.num_pairs:
    values:
      - 1
      - 3
      - 5
      - 7
      - 9
  aliases:
    values:
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
      # general
      - weak_strong
  model:
    values:
      - llama3_8b
  prompts/turns:
    values:
      - icl/main_new
  prompts.turns.same_sentence:
    value: false
  prompts.turns.same_pair_sentence:
    values:
      - true
  prompts.turns.swap_labels:
    values:
      - true
      - false
  perturbation.dropout_rate:
    values:
      - 0.060
      - 0.100
      - 0.140
      - 0.180
      - 0.220
      - 0.260
      - 0.300
      - 0.340
      - 0.380
      - 0.420
      - 0.460

  perturbation.noise_std:
    values:
      - 0.0100
      - 0.0101
      - 0.0102
      - 0.0103
      - 0.0104
      - 0.0105
      - 0.0106
      - 0.0107
      - 0.0108
      - 0.0109
      - 0.0110
