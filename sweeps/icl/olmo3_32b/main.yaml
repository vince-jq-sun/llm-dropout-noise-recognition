project: llm-mechanistic-detection
program: spe-icl
method: grid
name: icl-olmo3-32b

command:
  - ${env}
  - uv
  - run
  - spe-icl
  - --config-name
  - icl
  - ${args_no_hyphens}

parameters:
  experiment.num_samples:
    value: 1000
  model:
    values:
      - olmo3_32b
  prompts/turns:
    values:
      - icl/main_new
  experiment.sentences_file:
    values:
      - data/sentences/15tok.txt
  prompts.turns.num_pairs:
    values:
      - 1
      - 3
      - 5
      - 7
      - 9
  prompts.turns.same_sentence:
    value: false
  prompts.turns.same_pair_sentence:
    values:
      - true
#      - false
  prompts.turns.swap_labels:
    values:
      - true
      - false
  perturbation.dropout_rate:
    values:
      - 0.100
      - 0.174
      - 0.248
      - 0.322
      - 0.396
      - 0.470
      - 0.544
      - 0.618
      - 0.692
      - 0.766
      - 0.840

  perturbation.noise_std:
    values:
      - 0.010
      - 0.075
      - 0.140
      - 0.205
      - 0.270
      - 0.335
      - 0.400
      - 0.465
      - 0.530
      - 0.595
      - 0.660
