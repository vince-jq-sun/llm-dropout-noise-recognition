project: llm-mechanistic-detection
program: spe-icl
method: grid
name: icl-control-qwen3-32b-new-ranges

command:
  - ${env}
  - uv
  - run
  - spe-icl
  - --config-name
  - icl
  - ${args_no_hyphens}

# Control experiments: alias names, swap_labels

parameters:
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts.turns.num_pairs:
    values:
      - 1
      - 3
      - 5
      - 7
      - 9
  aliases:
    values:
      # placeholders
      - x_y
      - foo_bar
      # perturbations
      - masking_jitter
      - rotation_permutation
      - scaling_translation
      # unrelated
      - vanilla_chocolate
      # general
      - weak_strong
  model:
    values:
      - qwen3_32b
  prompts/turns:
    values:
      - icl/main_new
  prompts.turns.same_sentence:
    value: false
  prompts.turns.same_pair_sentence:
    values:
      - true
  prompts.turns.swap_labels:
    values:
      - true
      - false
  perturbation.dropout_rate:
    values:
      - 0.140
      - 0.184
      - 0.228
      - 0.272
      - 0.316
      - 0.360
      - 0.404
      - 0.448
      - 0.492
      - 0.536
      - 0.580

  perturbation.noise_std:
    values:
      - 0.090
      - 0.105
      - 0.120
      - 0.135
      - 0.150
      - 0.165
      - 0.180
      - 0.195
      - 0.210
      - 0.225
      - 0.240
